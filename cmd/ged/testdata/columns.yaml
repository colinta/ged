- name: whitespace splitting
  args: ["cols//3,1"]
  input: "alice 25 engineer"
  output: "engineer alice\n"

- name: comma splitting
  args: ["cols/,/1,3"]
  input: "a,b,c,d"
  output: "a c\n"

- name: custom joiner
  args: ["cols/,/1,3/ | "]
  input: "alice,25,engineer"
  output: "alice | engineer\n"

- name: negative index
  args: ["cols//-1,1"]
  input: "a b c d e"
  output: "e a\n"

- name: cols then substitute
  args: ["cols//1,2", "s/ /-/"]
  input: "a b c d"
  output: "a-b\n"

- name: cols with if condition
  args: ["if/alice/", "{", "cols/,/1,3", "}"]
  input: |
    alice,25,engineer
    bob,30,designer
  output: |
    alice engineer
    bob,30,designer
